<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Arranging the Widths</title>
    <link rel="stylesheet" href="arranging-the-widths.css">
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Rent Audi Vehicles</legend>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">

            <label for="car">Select</label>
            <select id="car" name="car">
                <option>Audi 80</option>
                <option>Audi 90</option>
                <option>Audi RS 6</option>
                <option>Audi S8</option>
            </select>

            <label>Select</label>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="15"></textarea>
        </fieldset>
    </form>
</body>
</html>
